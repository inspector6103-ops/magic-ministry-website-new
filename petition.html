<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>총리에게 바란다 - 영국 마법부 포털</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <div class="container">
      <a class="logo" href="index.html">← 포털 홈으로</a>
      <h1>총리에게 바란다</h1>
      <p>마법 사회의 목소리를 전하세요. 접수된 민원은 내부 검토 후 마법부 총리에게 전달됩니다.</p>
    </div>
  </header>

  <main class="container">
    <section class="form-section">
      <form class="form-card" id="petition-form">
        <label for="petition-name">이름</label>
        <input id="petition-name" type="text" name="name" placeholder="작성자 이름" required>

        <label for="petition-topic">분류</label>
        <select id="petition-topic" name="topic" required>
          <option value="">분류 선택</option>
          <option value="안전">마법 보안 및 안전</option>
          <option value="교육">호그와트 및 교육</option>
          <option value="행정">행정 서비스 개선</option>
          <option value="노동">노동 및 근로 환경</option>
        </select>

        <label for="petition-content">민원 내용</label>
        <textarea id="petition-content" name="content" rows="6" placeholder="민원 내용을 자세히 작성해주세요." required></textarea>

        <button type="submit" class="button primary">민원 등록</button>
        <p class="error-message" id="petition-error" aria-live="polite" hidden></p>
        <p class="success-message" id="petition-success" aria-live="polite" hidden>민원이 접수되었습니다.</p>
      </form>
    </section>

    <section class="list-section">
      <h2>접수된 민원</h2>
      <p class="list-help">아래 목록은 이 단말기에 기록된 최신 민원입니다.</p>
      <p class="list-help" id="petition-empty" hidden>아직 접수된 민원이 없습니다.</p>
      <ul id="petition-list" class="petition-list" aria-live="polite"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2024 영국 마법부. 마법부 기록 보관소에 의해 관리됩니다.</p>
    </div>
  </footer>

  <script src="auth.js"></script>
  <script>
    const petitionForm = document.getElementById('petition-form');
    const petitionList = document.getElementById('petition-list');
    const petitionEmpty = document.getElementById('petition-empty');
    const petitionError = document.getElementById('petition-error');
    const petitionSuccess = document.getElementById('petition-success');
    const submitButton = petitionForm.querySelector('button[type="submit"]');
    let currentUser = null;

    const redirectToLogin = () => {
      window.location.href = 'login.html';
    };

    const createMultilineParagraph = text => {
      const paragraph = document.createElement('p');
      const lines = text.split('\n');

      lines.forEach((line, index) => {
        paragraph.append(document.createTextNode(line));

        if (index < lines.length - 1) {
          paragraph.append(document.createElement('br'));
        }
      });

      return paragraph;
    };

    const renderPetitions = petitions => {
      petitionList.innerHTML = '';

      if (!petitions.length) {
        petitionEmpty.hidden = false;
        return;
      }

      petitionEmpty.hidden = true;

      petitions.forEach(petition => {
        const listItem = document.createElement('li');
        listItem.className = 'petition-item';

        const header = document.createElement('div');
        header.className = 'petition-header';

        const nameLabel = document.createElement('strong');
        nameLabel.textContent = petition.name;

        const topicBadge = document.createElement('span');
        topicBadge.className = 'badge';
        topicBadge.textContent = petition.topic;

        header.append(nameLabel, topicBadge);

        const contentParagraph = createMultilineParagraph(petition.content);

        const time = document.createElement('time');
        time.textContent = new Date(petition.timestamp).toLocaleString('ko-KR');

        listItem.append(header, contentParagraph, time);
        petitionList.appendChild(listItem);
      });
    };

    const setSubmitting = isSubmitting => {
      submitButton.disabled = isSubmitting;
      submitButton.textContent = isSubmitting ? '등록 중...' : '민원 등록';
    };

    const clearMessages = () => {
      petitionError.hidden = true;
      petitionError.textContent = '';
      petitionSuccess.hidden = true;
    };

    const ensureAuthenticated = async () => {
      try {
        const response = await window.ministryAuth.authorizedFetch('/api/me');
        if (!response.ok) {
          redirectToLogin();
          return null;
        }

        const payload = await response.json();
        if (!payload || !payload.user) {
          redirectToLogin();
          return null;
        }

        window.ministryAuth.saveUser(payload.user);
        currentUser = payload.user;
        return payload.user;
      } catch (error) {
        console.error('인증 정보를 확인하지 못했습니다.', error);
        redirectToLogin();
        return null;
      }
    };

    const loadPetitions = async () => {
      try {
        const response = await window.ministryAuth.authorizedFetch('/api/petitions');
        if (response.status === 401) {
          redirectToLogin();
          return;
        }

        if (!response.ok) {
          throw new Error('민원 목록을 불러오지 못했습니다.');
        }

        const payload = await response.json();
        const petitions = Array.isArray(payload.petitions) ? payload.petitions : [];
        petitions.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        renderPetitions(petitions);
      } catch (error) {
        console.error(error);
        petitionList.innerHTML = '';
        petitionEmpty.hidden = false;
      }
    };

    petitionForm.addEventListener('submit', async event => {
      event.preventDefault();
      clearMessages();

      const name = petitionForm.name.value.trim();
      const topic = petitionForm.topic.value;
      const content = petitionForm.content.value.trim();

      if (!name) {
        petitionError.textContent = '이름을 입력해주세요.';
        petitionError.hidden = false;
        return;
      }

      if (!topic || !content) {
        petitionError.textContent = '모든 필드를 올바르게 입력해주세요.';
        petitionError.hidden = false;
        return;
      }

      try {
        setSubmitting(true);
        const response = await window.ministryAuth.authorizedFetch('/api/petition', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, topic, content })
        });

        const payload = await response.json().catch(() => ({}));

        if (response.status === 401) {
          redirectToLogin();
          return;
        }

        if (!response.ok) {
          const message = payload && payload.error ? payload.error : '민원을 접수하지 못했습니다.';
          petitionError.textContent = message;
          petitionError.hidden = false;
          return;
        }

        petitionSuccess.hidden = false;
        petitionForm.reset();
        if (currentUser) {
          petitionForm.name.value = currentUser.id;
        }
        petitionForm.name.focus();
        await loadPetitions();
      } catch (error) {
        console.error('민원 접수 요청이 실패했습니다.', error);
        petitionError.textContent = '서버에 연결하지 못했습니다. 잠시 후 다시 시도해주세요.';
        petitionError.hidden = false;
      } finally {
        setSubmitting(false);
      }
    });

    ['name', 'topic', 'content'].forEach(fieldName => {
      petitionForm[fieldName].addEventListener('input', clearMessages);
    });

    ensureAuthenticated().then(user => {
      if (user && !petitionForm.name.value) {
        petitionForm.name.value = user.id;
      }
      if (user) {
        loadPetitions();
      }
    });
  </script>
</body>
</html>
