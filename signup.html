<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - 영국 마법부 포털</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <div class="container">
      <a class="logo" href="index.html">← 포털 홈으로</a>
      <h1>마법부 회원가입</h1>
      <p>공식 포털 서비스를 사용하려면 계정을 먼저 등록하세요.</p>
    </div>
  </header>

  <main class="container narrow">
    <form class="form-card" id="signup-form" novalidate>
      <h2>새 계정 등록</h2>
      <p class="list-help">아이디는 3자 이상, 비밀번호는 4자 이상 입력해주세요.</p>

      <label for="signup-id">아이디</label>
      <input id="signup-id" type="text" name="id" placeholder="마법부 아이디" minlength="3" required autocomplete="username">

      <label for="signup-password">비밀번호</label>
      <input id="signup-password" type="password" name="password" placeholder="비밀번호" minlength="4" required autocomplete="new-password">

      <button type="submit" class="button primary">회원가입</button>
      <p class="form-note">이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
      <p class="error-message" id="signup-error" aria-live="polite" hidden></p>
      <p class="success-message" id="signup-success" aria-live="polite" hidden>회원가입이 완료되었습니다! 이제 로그인하세요.</p>
    </form>

    <section class="list-section" aria-live="polite">
      <h2>등록된 마법부 아이디</h2>
      <p class="list-help">회원가입을 완료한 아이디가 최신 순으로 표시됩니다.</p>
      <p class="list-help" id="signup-registered-empty" hidden>아직 등록된 아이디가 없습니다.</p>
      <p class="error-message" id="signup-registered-error" hidden>등록된 아이디를 불러올 수 없습니다.</p>
      <ul class="user-list" id="signup-user-list"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2024 영국 마법부. 모든 정보는 마법부 보안 규정에 의해 보호됩니다.</p>
    </div>
  </footer>

  <script>
    const API_SIGNUP = '/api/signup';
    const API_ROSTER = '/api/signup/roster';

    const form = document.getElementById('signup-form');
    const idInput = document.getElementById('signup-id');
    const passwordInput = document.getElementById('signup-password');
    const submitButton = form.querySelector('button[type="submit"]');
    const errorMessage = document.getElementById('signup-error');
    const successMessage = document.getElementById('signup-success');
    const registeredList = document.getElementById('signup-user-list');
    const registeredEmpty = document.getElementById('signup-registered-empty');
    const registeredError = document.getElementById('signup-registered-error');

    const setSubmitting = isSubmitting => {
      submitButton.disabled = isSubmitting;
      submitButton.textContent = isSubmitting ? '등록 중...' : '회원가입';
    };

    const hideMessages = () => {
      errorMessage.hidden = true;
      errorMessage.textContent = '';
      successMessage.hidden = true;
    };

    const renderRegistered = users => {
      registeredList.innerHTML = '';

      if (!users.length) {
        registeredEmpty.hidden = false;
        registeredError.hidden = true;
        return;
      }

      registeredEmpty.hidden = true;
      registeredError.hidden = true;

      users.forEach(({ id, createdAt }, index) => {
        const item = document.createElement('li');
        const details = document.createElement('div');
        details.className = 'user-entry-details';

        const name = document.createElement('strong');
        name.textContent = id;
        details.appendChild(name);

        if (createdAt) {
          const time = document.createElement('time');
          time.dateTime = createdAt;
          time.textContent = new Date(createdAt).toLocaleString('ko-KR');
          details.appendChild(time);
        }

        const order = document.createElement('span');
        order.textContent = `#${String(index + 1).padStart(2, '0')}`;

        item.append(details, order);
        registeredList.appendChild(item);
      });
    };

    const loadRoster = async () => {
      try {
        const response = await fetch(API_ROSTER);
        if (!response.ok) {
          throw new Error('등록된 아이디를 불러올 수 없습니다.');
        }
        const payload = await response.json();
        const users = Array.isArray(payload.users) ? payload.users : [];
        renderRegistered(users);
      } catch (error) {
        console.error(error);
        registeredList.innerHTML = '';
        registeredEmpty.hidden = true;
        registeredError.hidden = false;
      }
    };

    form.addEventListener('submit', async event => {
      event.preventDefault();
      hideMessages();

      const id = idInput.value.trim();
      const password = passwordInput.value.trim();

      if (!id || !password) {
        errorMessage.textContent = '아이디와 비밀번호를 모두 입력해주세요.';
        errorMessage.hidden = false;
        return;
      }

      if (id.length < 3) {
        errorMessage.textContent = '아이디는 3자 이상 입력해주세요.';
        errorMessage.hidden = false;
        idInput.focus();
        return;
      }

      if (password.length < 4) {
        errorMessage.textContent = '비밀번호는 4자 이상 입력해주세요.';
        errorMessage.hidden = false;
        passwordInput.focus();
        return;
      }

      try {
        setSubmitting(true);

        const response = await fetch(API_SIGNUP, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, password }),
        });

        const payload = await response.json().catch(() => ({}));

        if (!response.ok) {
          if (response.status === 409) {
            errorMessage.textContent = '이미 등록된 아이디입니다.';
          } else if (payload && payload.error) {
            errorMessage.textContent = payload.error;
          } else {
            errorMessage.textContent = '회원가입 중 오류가 발생했습니다.';
          }
          errorMessage.hidden = false;
          return;
        }

        successMessage.hidden = false;
        form.reset();
        await loadRoster();
        idInput.focus();
      } catch (error) {
        console.error('회원가입 요청이 실패했습니다.', error);
        errorMessage.textContent = '서버에 연결하지 못했습니다. 잠시 후 다시 시도해주세요.';
        errorMessage.hidden = false;
      } finally {
        setSubmitting(false);
      }
    });

    idInput.addEventListener('input', hideMessages);
    passwordInput.addEventListener('input', hideMessages);

    loadRoster();
  </script>
</body>
</html>
